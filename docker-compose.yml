version: '3.8'

services:
  backend:
    build:
      context: ./backend/tea_backend
      dockerfile: Dockerfile
    container_name: smart-tea-backend
    ports:
      - "8080:8080"
    restart: unless-stopped
   
  ml-service:
    build:
      context: "./ml-models/yield ML"
      dockerfile: Dockerfile
    container_name: smart-tea-ml
    ports:
      - "5001:5000"
    restart: unless-stopped
    # This loads your SUPABASE_URL and SUPABASE_SERVICE_KEY into the container
    env_file:
      - "./ml-models/yield ML/.env"

  frontend:
    build:
      context: ./frontendapp
      dockerfile: Dockerfile
    container_name: smart-tea-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend
      - ml-service